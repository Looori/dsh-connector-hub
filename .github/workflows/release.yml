name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --registry=https://registry.npmmirror.com
      - run: pnpm exec playwright install chromium
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: npm pack ./packages/connector-hub --dry-run
      - name: Publish to npm
        run: npm publish ./packages/connector-hub --access public --provenance --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
