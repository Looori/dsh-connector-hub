id: github
name:
  zh: GitHub
  en: GitHub
description:
  zh: 搜索和读取代码仓库内容，管理 Issue、Pull Request 与评审，协助完成研发协作。
  en: Search and read repository content, manage issues and pull requests, and assist with code reviews and development workflows.
icon: data:image/svg+xml;base64,
homepage: https://github.com/
publisher: GitHub
official: true
remote:
  type: streamable-http
  url: https://api.githubcopilot.com/mcp/
auth:
  type: api-key
  in: header
  name: Authorization
  valueTemplate: Bearer ${value}
  label:
    zh: 个人访问令牌
    en: Personal access token
  helpUrl: https://github.com/settings/personal-access-tokens/new
