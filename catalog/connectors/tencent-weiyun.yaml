id: tencent-weiyun
name:
  zh: 腾讯微云
  en: Tencent Weiyun
description:
  zh: 查询微云目录、最近文件和分类文件列表，检索已有文件。
  en: List Weiyun directories, recent and categorized files, and search existing files.
icon: data:image/svg+xml;base64,
homepage: https://www.weiyun.com/act/openclaw
publisher: 腾讯微云
official: true
remote:
  type: streamable-http
  url: https://www.weiyun.com/api/v3/mcpserver
  probe:
    tool: weiyun.list
    arguments:
      limit: 1
auth:
  type: api-key
  in: header
  name: WyHeader
  valueTemplate: mcp_token=${value}
  label:
    zh: MCP Token
    en: MCP Token
  helpUrl: https://www.weiyun.com/act/openclaw
