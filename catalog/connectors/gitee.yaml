id: gitee
name:
  zh: Gitee（码云）
  en: Gitee
description:
  zh: 查询和管理 Gitee 仓库、代码文件、Issue、Pull Request 与评论，辅助代码协作。
  en: Access Gitee repositories and files, and manage issues, pull requests and comments for development collaboration.
icon: data:image/svg+xml;base64,
homepage: https://gitee.com/
publisher: Gitee
official: true
remote:
  type: streamable-http
  url: https://api.gitee.com/mcp
auth:
  type: api-key
  in: header
  name: Authorization
  valueTemplate: Bearer ${value}
  label:
    zh: 私人令牌
    en: Personal access token
  helpUrl: https://gitee.com/profile/personal_access_tokens
